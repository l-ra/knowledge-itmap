# Default values for knowledge-itmap.

replicaCount: 1

image:
  repository: ghcr.io/l-ra/knowledge-itmap
  # Empty → Chart.appVersion (set by CI/release via set-chart-version.sh)
  tag: ""
  pullPolicy: IfNotPresent

mcpImage:
  repository: ghcr.io/l-ra/knowledge-itmap-mcp
  # Empty → Chart.appVersion (same build version as UI)
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
# UI nginx image runs as uid 101 (nginx); listens on 8080 (no NET_BIND_SERVICE / CAP_CHOWN).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Cluster service port (maps to container 8080 via named targetPort http).
  port: 80

mcpService:
  type: ClusterIP
  port: 3100

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: itmap.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

mcpResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

knowledgeCore:
  # In-cluster Knowledge Core service (same namespace as release `kc`)
  url: http://kc-knowledge-core:8080

mcp:
  authMode: forward
  writePackages: "org-demo"
  defaultPackage: "org-demo"
  writeMode: propose
  lang: cs
  # Optional service-account token when authMode=service
  existingSecret: ""
  existingSecretKey: token
  oauth:
    enabled: false
    # Public base URL of ITMap ingress (required when oauth.enabled)
    publicUrl: ""
    # Pocket ID issuer (same as KC OIDC issuer) — also enables /token login UI
    issuer: ""
    # Public PKCE client_id (same as KC/ITMap UI)
    clientId: "knowledge-core"
    scopes: "openid,profile,email,groups"

extraEnv: []
mcpExtraEnv: []

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

mcpLivenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

mcpReadinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
