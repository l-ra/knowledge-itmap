apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-itmap.fullname" . }}
  labels:
    {{- include "knowledge-itmap.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "knowledge-itmap.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-itmap.mcpFullname" . }}
  labels:
    {{- include "knowledge-itmap.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: {{ .Values.mcpService.type }}
  ports:
    - port: {{ .Values.mcpService.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "knowledge-itmap.mcpSelectorLabels" . | nindent 4 }}
